    <script>
      // Gracefully prevent unhandled websocket disconnections in AI Studio preview iframe
      window.addEventListener('unhandledrejection', function(event) {
        if (event && event.reason && (
          String(event.reason).includes('WebSocket') ||
          String(event.reason?.message || '').includes('WebSocket') ||
          String(event.reason).includes('failed to connect to websocket')
        )) {
          event.preventDefault();
        }
      });
      window.addEventListener('error', function(event) {
        if (event && event.message && (
          event.message.includes('WebSocket') ||
          event.message.includes('failed to connect to websocket')
        )) {
          event.preventDefault();
        }
      });
    </script>
